name: monero_wallet_ui — create a stagenet wallet and receive into it, in one app
project_name: logos-monero-wallet-ui

# Every build is a flake URL rather than `path:..`: the harness runs each step in a throwaway
# working directory, not in the checkout. CI pins {release} to the commit under test with
# --release-for. `#install` stages ONE module, so the whole module chain is built beside it.
#
# The `.rep` secret-PROP tripwire lives in this repo's ci.yml, not here: it reads a source file,
# and the checkout is not what a doctest step runs in.
#
# Nothing below needs a reachable daemon: a wallet is created, opened and shown, and wallet2
# binds its node lazily, so this run does not depend on somebody else's public node being up.

intro: |
  One app covers the whole flow, so one headless run can too: the wallet list renders, the node is
  pointed somewhere, a stagenet wallet is created through the form, and the Receive tab shows its
  address and a QR. The password is typed into the only surface that takes one.

  The node is deliberately set to a dead local port, which makes the run offline and deterministic
  and puts the wallet in the state a user is in when their public node goes down — so the run also
  checks that the chrome admits it rather than showing a stale "Synced".

sections:
  - title: "Build the app, the host and the module tree"
    steps:
      # Basecamp's standalone mode, the app's real host: its design system is the one users get.
      - title: "Build Basecamp's standalone host and every module the app loads"
        run: |
          set -eu
          nix build 'github:logos-co/logos-basecamp#app-standalone' --no-write-lock-file -o result-basecamp
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp
          nix build 'github:logos-co/logos-monero-node-module{release}#install' --no-write-lock-file -o result-node
          nix build 'github:logos-co/logos-monero-wallet-core-module{release}#install' --no-write-lock-file -o result-core
          nix build 'github:logos-co/logos-monero-wallet-backend{release}#install' --no-write-lock-file -o result-backend
          nix build 'github:logos-co/logos-monero-wallet-ui{release}#install' --no-write-lock-file -o result-wallet
          # The node module depends on tor_module; this run never starts it (Nothing, below).
          nix build 'github:logos-co/logos-tor-module#install' --no-write-lock-file -o result-tor
          mkdir -p tree/modules
          cp -rL result-node/modules/* result-tor/modules/* \
                 result-core/modules/* result-backend/modules/* tree/modules/
          chmod -R u+w tree
          ls tree/modules result-wallet/plugins
        code_block: |
          nix build 'github:logos-co/logos-basecamp#app-standalone' -o result-basecamp
          nix build 'github:logos-co/logos-qt-mcp' -o result-mcp
          nix build 'github:logos-co/logos-tor-module#install' -o result-tor
          for m in node-module wallet-core-module wallet-backend; do
            nix build "github:logos-co/logos-monero-$m#install" -o "result-$m"
          done
          nix build 'github:logos-co/logos-monero-wallet-ui#install' -o result-wallet
          mkdir -p tree/modules
          cp -rL result-*/modules/* tree/modules/
          chmod -R u+w tree
        expect_contains: ["monero_wallet_ui", "monero_wallet_backend", "monero_wallet_core_module"]

  - title: "Drive the wallet"
    steps:
      - title: "Create a wallet, watch it open and sync, then read the receive address"
        ui_test:
          # LOGOS_NO_SCHEME_REGISTER: a test run leaves the machine's logos:// handler alone.
          launch: "env QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 LOGOS_NO_SCHEME_REGISTER=1 ./result-basecamp/bin/LogosBasecamp --module ./result-wallet --modules-dir ./tree/modules --user-dir ./userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 600
          tests:
            - name: "A fresh install leads to Node before any wallet"
              # With `timeout`, expect_property polls; a text wait would match hidden items.
              action: expect_property
              find_by: "objectName"
              find_value: "nodeSetupNotice"
              property: "visible"
              value: true
              timeout: 30000
              screenshot: "wallet-ui-node-setup.png"
            - name: "Open Node from the notice"
              action: call_method
              find_by: "objectName"
              find_value: "nodeSetupButton"
              method: "clicked"
              args: []
            - name: "Node opens, not saved yet"
              action: expect_property
              find_by: "objectName"
              find_value: "saveNodeButton"
              property: "text"
              value: "Save"
              timeout: 15000
              screenshot: "wallet-ui-node-first-save.png"
            - name: "Public sources, with Use Tor for Nothing, so this run never starts Tor: picking saves it"
              action: call_method
              find_by: "objectName"
              find_value: "torUse_none"
              method: "clicked"
              args: []
            - name: "The node has it chosen"
              action: expect_property
              find_value: "moneroWalletRoot"
              property: "torUseUnchosen"
              value: false
              timeout: 30000
            - name: "Close Node"
              action: call_method
              find_value: "moneroWalletRoot"
              method: "closeSheets"
              args: []
            - name: "The notice is gone from the Wallets screen"
              action: expect_property
              find_by: "objectName"
              find_value: "nodeSetupNotice"
              property: "visible"
              value: false
              timeout: 30000
            - name: "With nothing open the app shows the Wallets screen"
              action: wait_for
              texts: ["No wallet open", "Wallets"]
              timeout: 30000
              screenshot: "wallet-ui-wallets.png"
            - name: "The node form is REACHABLE with no wallet open — the Wallets screen owns it"
              # The regression this exists for: the form used to live in the Settings tab, which
              # exists only while a wallet is OPEN, while its fields were enabled only while none
              # was. Visible exactly when unusable, so the node could not be changed from the app
              # at all. Asserted here, before any wallet exists, because that is the state a user
              # is in when a node goes down and they need to point somewhere else.
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "openSheet"
              args: ["node"]
            - name: "The sheet itself is on screen (not merely present in the tree)"
              # `visible` is the half that fails if the form ever goes back behind an open
              # wallet: findByProperty ignores visibility, so asserting the field alone would
              # pass either way. A closed Dialog reports visible false.
              action: expect_property
              find_by: "objectName"
              find_value: "nodeSheet"
              property: "visible"
              value: true
            - name: "The node sheet holds the choice, as it was answered"
              action: expect_property
              find_by: "objectName"
              find_value: "torUse_none"
              property: "checked"
              value: true
            - name: "Choose your own node, at an address"
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "chooseNodeSource"
              args: ["own", "address"]
            - name: "...and its address field accepts input"
              action: expect_property
              find_by: "objectName"
              find_value: "ownAddressField"
              property: "enabled"
              value: true
            - name: "Point it at a port nothing is listening on"
              # Deliberately unreachable, and deliberately LOCAL: it makes the rest of this run
              # offline and deterministic, and it reproduces the state a user is in when their
              # node goes down. Saving it also exercises the write path that was unreachable
              # from the app until this form moved here.
              action: set_text
              find_by: "objectName"
              find_value: "ownAddressField"
              value: "http://127.0.0.1:1"
            - name: "The address decides the route: this computer is reached directly"
              action: expect_property
              find_by: "objectName"
              find_value: "ownRouteLine"
              property: "text"
              value: "Reached directly. Tor can't reach your network."
              screenshot: "wallet-ui-node.png"
            - name: "Done stores it and closes Node"
              action: call_method
              find_by: "objectName"
              find_value: "saveNodeButton"
              method: "clicked"
              args: []
            - name: "The node module stores it as your own node"
              # `own` round-trips only through a node module that keeps it (CI pins that draft).
              action: expect_property
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              property: "storedSource"
              value: "own-address"
              timeout: 30000
            - name: "Open Node again"
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "openSheet"
              args: ["node"]
            - name: "Back to the node picked for you"
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "chooseNodeSource"
              args: ["public", "picked"]
            - name: "Done stores it and closes Node"
              action: call_method
              find_by: "objectName"
              find_value: "saveNodeButton"
              method: "clicked"
              args: []
            - name: "The picked node saves, with no address of its own"
              # The app sends it without a url; a node module that required one refused the save.
              action: expect_property
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              property: "storedSource"
              value: "public-picked"
              timeout: 30000
            - name: "Open Node again"
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "openSheet"
              args: ["node"]
            - name: "Your own node again, for the rest of this run"
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "chooseNodeSource"
              args: ["own", "address"]
            - name: "...at the same unreachable local port"
              action: set_text
              find_by: "objectName"
              find_value: "ownAddressField"
              value: "http://127.0.0.1:1"
            - name: "Done stores it and closes Node"
              action: call_method
              find_by: "objectName"
              find_value: "saveNodeButton"
              method: "clicked"
              args: []
            - name: "Stored as your own node again"
              action: expect_property
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              property: "storedSource"
              value: "own-address"
              timeout: 30000
            - name: "Open the Create sheet (via the root: a driver cannot click a LogosTabButton)"
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "openSheet"
              args: ["create"]
            - name: "Name the wallet"
              action: set_text
              find_by: "objectName"
              find_value: "createNameField"
              value: "doctest"
            - name: "Type the password"
              action: set_text
              find_by: "objectName"
              find_value: "createPasswordField"
              value: "doctest-pw"
            - name: "Repeat the password"
              action: set_text
              find_by: "placeholderText"
              find_value: "Repeat password"
              value: "doctest-pw"
            - name: "Create"
              action: click
              target: "Create wallet"
            - name: "The wallet opens — same app, no hop to a separate keys surface"
              # `wait_for` polls and matches text by EQUALITY, so the anchor has to be a string
              # that is both stable and only true once this wallet is open. The status line and
              # the sync chip both carry a live height and percentage, so neither can be one.
              action: wait_for
              texts: ["Wallet: doctest"]
              timeout: 60000
              screenshot: "wallet-ui-open.png"
            - name: "Creating dismissed its sheet — no stale form left over the open wallet"
              # A screenshot caught this while every assertion passed: findByProperty reads
              # straight through a popup, so nothing in this run noticed two sheets stacked on
              # top of the balance. Asserted on `visible`, which is the only thing that can tell.
              action: expect_property
              find_by: "objectName"
              find_value: "createWalletSheet"
              property: "visible"
              value: false
            - name: "...and neither is the node sheet opened earlier"
              action: expect_property
              find_by: "objectName"
              find_value: "nodeSheet"
              property: "visible"
              value: false
            - name: "The wallet is open but the engine is NOT connected, and the chrome says so"
              # wallet2 keeps serving its last known daemon height after the daemon goes away, so
              # before this the sync chip went on printing "Synced … 100%" over a dead node — in a
              # wallet, a claim that your balance is current. Asserted as a property rather than
              # by matching the chip's text, which carries live heights.
              action: expect_property
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              property: "engineConnected"
              value: false
            - name: "Go to Receive"
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "selectTab"
              args: [2]
            - name: "Let the read poll publish the address and its QR (m_readPoll is 3s)"
              action: sleep
              ms: 5000
            - name: "The receive address and its QR render"
              # `expect_property` reads the property ONCE and compares against `value:` — it does
              # not poll and it ignores `expected:`. Hence the sleep above.
              action: expect_property
              find_by: "objectName"
              find_value: "qrBox"
              property: "visible"
              value: true
              screenshot: "wallet-ui-receive.png"
            - name: "...and the Close wallet control is on the chrome, not buried in Settings"
              # The user's report: closing was four clicks into the Settings tab. It is a
              # session action, so it lives beside the badges and is visible from every tab.
              action: expect_property
              find_by: "objectName"
              find_value: "closeWalletButton"
              property: "visible"
              value: true
            - name: "Close the Stagenet wallet before changing networks"
              action: click_object
              find_by: "objectName"
              find_value: "closeWalletButton"
            - name: "The wallet list returns"
              action: wait_for
              texts: ["No wallet open", "Wallets"]
              timeout: 30000
            - name: "Allow the completed close job to reach the UI poller"
              action: sleep
              ms: 1500
            - name: "The network picker in the header is enabled after closing"
              action: expect_property
              find_value: "networkPicker"
              property: "enabled"
              value: true
              timeout: 15000
            - name: "Select Mainnet"
              action: call_method
              find_value: "moneroWalletRoot"
              method: "selectNetwork"
              args: ["mainnet"]
            - name: "The header shows Mainnet"
              action: expect_property
              find_value: "networkPicker"
              property: "displayText"
              value: "mainnet"
              timeout: 15000
            - name: "The Use Tor for shown is Mainnet's"
              # Read after the network list; an older backend names no network, and the view falls back to the active one.
              action: expect_property
              find_value: "moneroWalletRoot"
              property: "torUseNetwork"
              value: "mainnet"
              timeout: 15000
            - name: "Each network has its own setting: open Node on Mainnet"
              action: call_method
              find_by: "objectName"
              find_value: "nodeSettingsButton"
              method: "clicked"
              args: []
            - name: "Nothing again on Mainnet"
              # A node module that keeps one setting for every network has it already; the pick is then a no-op.
              action: call_method
              find_by: "objectName"
              find_value: "torUse_none"
              method: "clicked"
              args: []
            - name: "Mainnet has it chosen, so no notice"
              action: expect_property
              find_by: "objectName"
              find_value: "nodeSetupNotice"
              property: "visible"
              value: false
              timeout: 30000
            - name: "Close Node on Mainnet"
              action: call_method
              find_value: "moneroWalletRoot"
              method: "closeSheets"
              args: []
            - name: "The Wallets screen shows for Mainnet"
              action: expect_property
              find_by: "objectName"
              find_value: "walletsPage"
              property: "visible"
              value: true
              timeout: 30000
            - name: "Mainnet has no Stagenet wallet to open"
              action: wait_for
              texts: ["No wallets on mainnet yet"]
              timeout: 15000
            - name: "The header still shows Mainnet with no wallet open"
              action: expect_property
              find_value: "networkPicker"
              property: "displayText"
              value: "mainnet"
            - name: "Mainnet does not list the Stagenet wallet"
              action: expect_property
              find_value: "walletsEmpty"
              property: "visible"
              value: true
            - name: "Try opening the Stagenet wallet by name anyway"
              action: call_method
              find_value: "moneroWalletRoot"
              method: "openSheet"
              args: ["open"]
            - name: "Enter the Stagenet wallet name"
              action: set_text
              find_by: "objectName"
              find_value: "openNameField"
              value: "doctest"
            - name: "Enter its password"
              action: set_text
              find_by: "objectName"
              find_value: "openPasswordField"
              value: "doctest-pw"
            - name: "Request opening on Mainnet"
              action: click_object
              find_value: "openButton"
            - name: "The backend refuses the wrong network before opening"
              action: wait_for
              texts: ["open: This wallet belongs to stagenet. Select stagenet before opening it."]
              timeout: 15000
            - name: "The Stagenet balance is never shown under Mainnet"
              action: expect_property
              find_value: "moneroWalletRoot"
              property: "walletOpen"
              value: false
            - name: "Select Stagenet again"
              action: call_method
              find_value: "moneroWalletRoot"
              method: "selectNetwork"
              args: ["stagenet"]
            - name: "Wait for the Stagenet wallet list"
              action: wait_for
              texts: ["doctest", "stagenet"]
              timeout: 15000
            - name: "The Stagenet wallet is listed again"
              action: expect_property
              find_value: "walletsEmpty"
              property: "visible"
              value: false
            - name: "Open the wallet on its correct network"
              action: call_method
              find_value: "moneroWalletRoot"
              method: "openSheet"
              args: ["open"]
            - name: "Reenter its password"
              action: set_text
              find_by: "objectName"
              find_value: "openPasswordField"
              value: "doctest-pw"
            - name: "Open on Stagenet"
              action: click_object
              find_value: "openButton"
            - name: "The wallet can still open on Stagenet after the refusal"
              action: wait_for
              texts: ["Wallet: doctest"]
              timeout: 30000
            - name: "The header reports the open wallet's actual Stagenet network"
              action: expect_property
              find_value: "networkPicker"
              property: "displayText"
              value: "stagenet"
              screenshot: "wallet-ui-network-isolation.png"
