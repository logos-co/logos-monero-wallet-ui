name: monero_wallet_ui — create a stagenet wallet and receive into it, in one app
project_name: logos-monero-wallet-ui

intro: |
  One app covers the whole flow, so one headless run can too: the wallet list renders, a stagenet
  wallet is created through the form, the wallet opens and starts syncing, and the Receive tab
  shows its address and a QR. The password is typed into the only surface that takes one — and its
  `.rep` still may not name a secret in a PROP, which is what CI asserts.

sections:
  - title: "Build the app, the host and the module tree"
    steps:
      - run: |
          nix build 'github:logos-co/logos-standalone-app' --no-write-lock-file -o result-app
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp
          nix build 'github:logos-co/logos-capability-module#install' --no-write-lock-file -o result-capability
          nix build 'path:..#install' -o result-wallet
          mkdir -p tree/modules tree/plugins
          cp -r result-capability/modules/* tree/modules/
          cp -r result-wallet/modules/*     tree/modules/
          cp -r result-wallet/plugins/*     tree/plugins/
          ls tree/modules tree/plugins
        expect_contains: ["monero_wallet_ui", "monero_wallet_backend"]
      - title: "No secret may be declared as a PROP (a PROP is cached and broadcast to every replica)"
        # scripts/check-rep-passwords.py in logos-workspace OWNS this rule; this is a local
        # tripwire, not a second copy of it. Deliberately a case-insensitive SUBSTRING match with
        # no word boundaries, which is strictly WIDER than any \\b-anchored spelling — so it cannot
        # silently drift weaker than the real gate the way a copied regex already did once
        # (\\bpassword\\b never matched newPassword).
        run: |
          ! grep -niE '^[[:space:]]*PROP[[:space:]]*\(.*(password|passphrase|mnemonic|seed|privkey|private_key|spendkey|viewkey|secretkey)' src/monero_wallet_ui.rep && echo NO_SECRET_PROP
        expect_contains: ["NO_SECRET_PROP"]

  - title: "Drive the wallet"
    steps:
      - title: "Create a wallet, watch it open and sync, then read the receive address"
        ui_test:
          launch: "env QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-app/bin/logos-standalone-app -p ./tree/plugins/monero_wallet_ui -m ./tree/modules --load monero_wallet_backend -u ./userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 600
          tests:
            - name: "With nothing open the app shows the Wallets screen"
              action: wait_for
              texts: ["No wallet open", "No wallets on this device yet. Create one, or restore from a seed."]
              timeout: 30000
              screenshot: "wallet-ui-wallets.png"
            - name: "Go to Create (navigate via the root: only the active StackLayout page is in the scene)"
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "selectWalletsPage"
              args: [2]
            - name: "Name the wallet"
              action: set_text
              find_by: "objectName"
              find_value: "createNameField"
              value: "doctest"
            - name: "Type the password"
              action: set_text
              find_by: "objectName"
              find_value: "createPasswordField"
              value: "doctest-pw"
            - name: "Repeat the password"
              action: set_text
              find_by: "placeholderText"
              find_value: "Repeat password"
              value: "doctest-pw"
            - name: "Create"
              action: click
              target: "Create wallet"
            - name: "The wallet opens and starts syncing — same app, no hop"
              action: wait_for
              texts: ["Open: doctest · syncing"]
              timeout: 60000
              screenshot: "wallet-ui-open.png"
            - name: "Go to Receive"
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "selectTab"
              args: [2]
            - name: "The receive address and its QR render"
              action: expect_property
              find_by: "objectName"
              find_value: "qrBox"
              property: "visible"
              expected: true
              timeout: 30000
              screenshot: "wallet-ui-receive.png"
