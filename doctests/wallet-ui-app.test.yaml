name: monero_wallet_ui — the spending surface renders with no wallet open
project_name: logos-monero-wallet-ui

intro: |
  Builds the wallet app and its module tree and launches it headless. With no wallet open it must
  render the locked state and offer to ask the keys app — and must never show a password field.

sections:
  - title: "Build"
    steps:
      - run: |
          nix build 'github:logos-co/logos-standalone-app' --no-write-lock-file -o result-app
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp
          nix build 'github:logos-co/logos-capability-module#install' --no-write-lock-file -o result-capability
          nix build 'path:..#install' -o result-wallet
          mkdir -p tree/modules tree/plugins
          cp -r result-capability/modules/* tree/modules/
          cp -r result-wallet/modules/*     tree/modules/
          cp -r result-wallet/plugins/*     tree/plugins/
        expect_contains: []
      - title: "The .rep declares no secret (the CI gate's rule, applied here too)"
        run: |
          ! grep -nE '^\s*(PROP|SLOT)\s*\(.*\b(password|passphrase|mnemonic|seed|privkey|private_?key)\b' src/monero_wallet_ui.rep && echo REP_CLEAN
        expect_contains: ["REP_CLEAN"]

  - title: "Drive the wallet app"
    steps:
      - ui_test:
          launch: "env QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-app/bin/logos-standalone-app -p ./tree/plugins/monero_wallet_ui -m ./tree/modules --load monero_wallet_backend -u ./userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 600
          tests:
            - name: "Locked state renders with the unlock hop"
              action: wait_for
              texts: ["No wallet is open.", "Open a wallet…"]
              timeout: 30000
              screenshot: "wallet-ui-locked.png"
            - name: "The network chip shows the active network"
              action: wait_for
              texts: ["STAGENET"]
              timeout: 10000
