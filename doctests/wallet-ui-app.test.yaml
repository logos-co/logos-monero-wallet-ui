name: monero_wallet_ui — create a stagenet wallet and receive into it, in one app
project_name: logos-monero-wallet-ui

# Every build is a flake URL rather than `path:..`: the harness runs each step in a throwaway
# working directory, not in the checkout. CI pins {release} to the commit under test with
# --release-for. `#install` stages ONE module, so the whole module chain is built beside it.
#
# The `.rep` secret-PROP tripwire lives in this repo's ci.yml, not here: it reads a source file,
# and the checkout is not what a doctest step runs in.
#
# Nothing below needs a reachable daemon: a wallet is created, opened and shown, and wallet2
# binds its node lazily, so this run does not depend on somebody else's public node being up.

intro: |
  One app covers the whole flow, so one headless run can too: the wallet list renders, the node is
  pointed somewhere, a stagenet wallet is created through the form, and the Receive tab shows its
  address and a QR. The password is typed into the only surface that takes one.

  The node is deliberately set to a dead local port, which makes the run offline and deterministic
  and puts the wallet in the state a user is in when their public node goes down — so the run also
  checks that the chrome admits it rather than showing a stale "Synced".

sections:
  - title: "Build the app, the host and the module tree"
    steps:
      - title: "Build every module the app loads, and stage them into one tree"
        run: |
          set -eu
          nix build 'github:logos-co/logos-standalone-app' --no-write-lock-file -o result-app
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp
          nix build 'github:logos-co/logos-capability-module#install' --no-write-lock-file -o result-capability
          nix build 'github:logos-co/logos-monero-node-module{release}#install' --no-write-lock-file -o result-node
          nix build 'github:logos-co/logos-monero-wallet-core-module{release}#install' --no-write-lock-file -o result-core
          nix build 'github:logos-co/logos-monero-wallet-backend{release}#install' --no-write-lock-file -o result-backend
          nix build 'github:logos-co/logos-monero-wallet-ui{release}#install' --no-write-lock-file -o result-wallet
          mkdir -p tree/modules tree/plugins
          cp -rL result-capability/modules/* result-node/modules/* \
                 result-core/modules/* result-backend/modules/* tree/modules/
          cp -rL result-wallet/plugins/* tree/plugins/
          chmod -R u+w tree
          ls tree/modules tree/plugins
        code_block: |
          nix build 'github:logos-co/logos-standalone-app' -o result-app
          nix build 'github:logos-co/logos-qt-mcp' -o result-mcp
          nix build 'github:logos-co/logos-capability-module#install' -o result-capability
          for m in node-module wallet-core-module wallet-backend wallet-ui; do
            nix build "github:logos-co/logos-monero-$m#install" -o "result-$m"
          done
          mkdir -p tree/modules tree/plugins
          cp -rL result-*/modules/* tree/modules/
          cp -rL result-wallet-ui/plugins/* tree/plugins/
          chmod -R u+w tree
        expect_contains: ["monero_wallet_ui", "monero_wallet_backend", "monero_wallet_core_module"]

  - title: "Drive the wallet"
    steps:
      - title: "Create a wallet, watch it open and sync, then read the receive address"
        ui_test:
          launch: "env QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-app/bin/logos-standalone-app -p ./tree/plugins/monero_wallet_ui -m ./tree/modules --load monero_wallet_backend -u ./userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 600
          tests:
            - name: "With nothing open the app shows the Wallets screen"
              action: wait_for
              texts: ["No wallet open", "Wallets"]
              timeout: 30000
              screenshot: "wallet-ui-wallets.png"
            - name: "The node form is REACHABLE with no wallet open — the Wallets screen owns it"
              # The regression this exists for: the form used to live in the Settings tab, which
              # exists only while a wallet is OPEN, while its fields were enabled only while none
              # was. Visible exactly when unusable, so the node could not be changed from the app
              # at all. Asserted here, before any wallet exists, because that is the state a user
              # is in when a node goes down and they need to point somewhere else.
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "openSheet"
              args: ["node"]
            - name: "The sheet itself is on screen (not merely present in the tree)"
              # `visible` is the half that fails if the form ever goes back behind an open
              # wallet: findByProperty ignores visibility, so asserting the field alone would
              # pass either way. A closed Dialog reports visible false.
              action: expect_property
              find_by: "objectName"
              find_value: "nodeSheet"
              property: "visible"
              value: true
            - name: "...and its address field accepts input"
              action: expect_property
              find_by: "objectName"
              find_value: "nodeHostField"
              property: "enabled"
              value: true
              screenshot: "wallet-ui-node.png"
            - name: "Point it at a port nothing is listening on"
              # Deliberately unreachable, and deliberately LOCAL: it makes the rest of this run
              # offline and deterministic, and it reproduces the state a user is in when their
              # public node goes down. Saving it also exercises the write path that was
              # unreachable from the app until this form moved here.
              action: set_text
              find_by: "objectName"
              find_value: "nodeHostField"
              value: "http://127.0.0.1:1"
            - name: "Save node"
              action: click
              target: "Save node"
            - name: "Open the Create sheet (via the root: a driver cannot click a LogosTabButton)"
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "openSheet"
              args: ["create"]
            - name: "Name the wallet"
              action: set_text
              find_by: "objectName"
              find_value: "createNameField"
              value: "doctest"
            - name: "Type the password"
              action: set_text
              find_by: "objectName"
              find_value: "createPasswordField"
              value: "doctest-pw"
            - name: "Repeat the password"
              action: set_text
              find_by: "placeholderText"
              find_value: "Repeat password"
              value: "doctest-pw"
            - name: "Create"
              action: click
              target: "Create wallet"
            - name: "The wallet opens — same app, no hop to a separate keys surface"
              # `wait_for` polls and matches text by EQUALITY, so the anchor has to be a string
              # that is both stable and only true once this wallet is open. The status line and
              # the sync chip both carry a live height and percentage, so neither can be one.
              action: wait_for
              texts: ["Wallet: doctest"]
              timeout: 60000
              screenshot: "wallet-ui-open.png"
            - name: "Creating dismissed its sheet — no stale form left over the open wallet"
              # A screenshot caught this while every assertion passed: findByProperty reads
              # straight through a popup, so nothing in this run noticed two sheets stacked on
              # top of the balance. Asserted on `visible`, which is the only thing that can tell.
              action: expect_property
              find_by: "objectName"
              find_value: "createWalletSheet"
              property: "visible"
              value: false
            - name: "...and neither is the node sheet opened earlier"
              action: expect_property
              find_by: "objectName"
              find_value: "nodeSheet"
              property: "visible"
              value: false
            - name: "The wallet is open but the engine is NOT connected, and the chrome says so"
              # wallet2 keeps serving its last known daemon height after the daemon goes away, so
              # before this the sync chip went on printing "Synced … 100%" over a dead node — in a
              # wallet, a claim that your balance is current. Asserted as a property rather than
              # by matching the chip's text, which carries live heights.
              action: expect_property
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              property: "engineConnected"
              value: false
            - name: "Go to Receive"
              action: call_method
              find_by: "objectName"
              find_value: "moneroWalletRoot"
              method: "selectTab"
              args: [2]
            - name: "Let the read poll publish the address and its QR (m_readPoll is 3s)"
              action: sleep
              ms: 5000
            - name: "The receive address and its QR render"
              # `expect_property` reads the property ONCE and compares against `value:` — it does
              # not poll and it ignores `expected:`. Hence the sleep above.
              action: expect_property
              find_by: "objectName"
              find_value: "qrBox"
              property: "visible"
              value: true
              screenshot: "wallet-ui-receive.png"
            - name: "...and the Close wallet control is on the chrome, not buried in Settings"
              # The user's report: closing was four clicks into the Settings tab. It is a
              # session action, so it lives beside the badges and is visible from every tab.
              action: expect_property
              find_by: "objectName"
              find_value: "closeWalletButton"
              property: "visible"
              value: true
